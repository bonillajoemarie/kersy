[package]
name = "kersy"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "time"] }
log = "0.4"
dirs = "6"
kersy-core = { path = "../crates/kersy-core" }

[dev-dependencies]
tempfile = "3"
